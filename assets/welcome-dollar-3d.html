<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Ready Set New</title>
    <!--
      Ready Set New - 3D text-art dollar sign (welcome sign, wallet, game asset).
      A real solid dollar sign: round tubes, shaded with characters, spinning slowly,
      bobbing up and down, with dots falling around it. Self-contained, no dependencies.

      Options (URL query):
        embed=1        transparent background, for placing over other screens or inside a game
        loop=1         fade in once and then stay on screen (wallet use)
        hold=8         seconds on screen between fade in and fade out (default 8)
        fadein=1.8     fade in seconds       fadeout=1.4   fade out seconds
        angle=40       freeze at a fixed angle (testing)
        shape=fat      (default) the original art as a fat slab: flat walls, rounded edges, slightly puffy face
        shape=body     round body whose side profile matches the original (see also ambient-dollar-3d.html)
        shape=drawn    use the drawn $ glyph instead of the original art
        holo=1         hologram for game scenes: transparent, glowing, flickering, scanlines, no falling dots, stays on
        phase=3        start the spin/bob this many seconds in, so two copies do not move in step
        dir=-1         spin the other way (use for the mirrored copy)

      When the fade out finishes it fires window event "rsn-welcome-done" and posts
      {type:"rsn-welcome-done"} to the parent window, so the next scene can start.
    -->
    <style>
        html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
        #view { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; display: block; }
        noscript { color: #0f0; font: 14px monospace; position: fixed; inset: 0; display: grid; place-items: center; }
    </style>
</head>
<body>
    <canvas id="view"></canvas>
    <noscript>$</noscript>
    <script>
    (function () {
        var q = new URLSearchParams(location.search);
        var HOLO = q.get('holo') === '1';
        var EMBED = q.get('embed') === '1' || HOLO, LOOP = q.get('loop') === '1' || HOLO;
        var PHASE = parseFloat(q.get('phase') || '0') || 0, DIR = q.get('dir') === '-1' ? -1 : 1;
        var HOLD = parseFloat(q.get('hold') || '8'), FADE_IN = parseFloat(q.get('fadein') || '1.8'), FADE_OUT = parseFloat(q.get('fadeout') || '1.4');
        var fixed = /^-?[\d.]+$/.test(q.get('angle') || '') ? parseFloat(q.get('angle')) : null;
        if (EMBED) { document.documentElement.style.background = 'transparent'; document.body.style.background = 'transparent'; }

        var canvas = document.getElementById('view');
        var ctx = canvas.getContext('2d');
        if (!ctx) return;
        var calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

        // ---------- 1. Draw a flat dollar sign, then read it as a grid of character cells ----------
        var ART = `     .                      .               .           .                                           
             .   .                         .               ..                 .                     
  .                                                          .      .        .        .             
                   .                    ..........                            .          .          
                                      ..=***+###--:....                                     .       
.                                     .-=====*##---------:.                    .             .      
                                   ....-=====*##=========:.            .                            
           .                  ...:--===============+**#**=....                                   .  
                         ...:============================*##*----:.....               .      .      
                       ..:==================================*##+------..             .              
 .                    .:======================================###=------:..                 .       
                     .-========================================*##*-------:.     .                  
 .                 ..===========================================+##*--------.        .             .
        .          .==================+======+===================*##*--------.                      
  .               .-===============+##*======*#*==================###=--------.                     
          .       .===============+##*+======*##==================+###--------:.                    
           .    . :===============*##*+======*##--======+++***#************+=-:.         .          
                  -===============*##*+======*#*-:---++============-:..           .         .       
     .      .     -+==============+*#*++====+##*::::::::::......             .                      
           .      :++++++++++++++++++**++++++##*::::::::::.             .         .  .     .        
          .       .++++++++++++++++++++++++++*##::::::::::.                                         
        .         .-+++++++++++++++++++++++++++++++==-----:.....  .      .            .             
   .         .     .=+++++++++++++++++++++++++++++++++**=------:...          .                      
                   ..=++++++++++++++++++++++++++++++++++++**+-:::::::..  .                          
                     .:++++++++++++++++++++++++++++++++++++++*#+-:::::::...       .            .    
..                     .-++++++++++++++++++++++++++++++++++++++*#*-::::::::.                    .  .
     .          .    .   ..=+++++++++++++++++++++++++++++++++++++##+::::::::...        .       .    
              .               :+++++++++++++++++++++++++++++++++++*##:::::::::.                     
                                ..:-+*+++++++++++++++++++++++++++++###-::::::::. .                  
                                 .  ...++++++++++++++++++++++++++++*##*:::::::::.              .    
                .        .            .+*****##*+***************+***###-::::::::.                   
             .              ...........+*****###-=+******************##*::::::::.    .  .       .   
 .               .........:-=+++*#*-::-+*****###---=*****************###::::::::.                   
               .=+***************##----+*****###----+****************###::::::::.       .        .  
       . .     .-*****************#+---******##*----+****************###::::::::.                   
               ..******************#===******###********************###*::::::::.  .                
           .     -*******************==******#####*****************#####********.                   
                ..=**************************###*******************############..        .          
       .   ..     .=**********************************************############-..      .     .      
                   .-*******************************************############*:.    ..               
                     .+****************************************############*.          .            
       .     . .      .:*#################################################:.                        
              . .      ..-#############################################+:..     .             .     
                          .:=######################################*=:. .                           
      .     . .             ...:+*#########################**+=-:...       .      .                 
                                    ..:*#########**++=---:.    .            ..                      
                         ..............*#######*---------:................                         .
             .........................:########*::::::::::..........................      .         
   .       ......................:::::-########*:::::------::::::......................          .  
      .    .....................:::::---===++++*+*++++===----:::::......................            
 .    .    ............................::::::::::-:::::::::..........................               
           .       ............................................................              .      
  .                        .......  .   . ...............       ......        .   .   .     .       
                   .                               .                                       .        
                                                                              .                     `;
        var SHAPE = q.get('shape') || 'fat', ORIG = SHAPE !== 'drawn';
        var CW = 8.4, CH = 16.8, cols = 68, rows = 54, lines = null;
        if (ORIG) {
            lines = ART.replace(/^\n/, '').replace(/\s+$/, '').split('\n');
            rows = lines.length; cols = 0;
            lines.forEach(function (l) { cols = Math.max(cols, l.length); });
        }
        var W = cols * CW, H = rows * CH;
        var g = document.createElement('canvas'); g.width = Math.ceil(W); g.height = Math.ceil(H);
        var gx = g.getContext('2d');
        gx.strokeStyle = '#fff'; gx.lineCap = 'butt';
        var cx0 = W / 2, cy0 = H / 2, RX = 205, RY = 168;
        gx.lineWidth = 86;
        gx.beginPath();
        gx.ellipse(cx0, cy0 - RY, RX, RY, 0, -0.2 * Math.PI, -1.5 * Math.PI, true);   // upper bowl, ends at the middle
        gx.ellipse(cx0, cy0 + RY, RX, RY, 0, -0.5 * Math.PI, 0.8 * Math.PI, false);   // lower bowl
        gx.stroke();
        gx.lineWidth = 38;
        gx.beginPath(); gx.moveTo(cx0, 24); gx.lineTo(cx0, H - 24); gx.stroke();      // the vertical bar
        var img = ORIG ? null : gx.getImageData(0, 0, g.width, g.height).data;

        var occ = [], r, c;
        function at(r2, c2) { var l = lines && lines[r2]; return (l && c2 >= 0 && c2 < l.length) ? l[c2] : ' '; }
        function solidCh(ch) { return ch !== ' ' && ch !== '.'; }
        function nearSolid(r2, c2) { for (var a = -2; a <= 2; a++) for (var b = -2; b <= 2; b++) if (solidCh(at(r2 + a, c2 + b))) return true; return false; }
        for (r = 0; r < rows; r++) {
            occ[r] = [];
            for (c = 0; c < cols; c++) {
                if (ORIG) { var ch0 = at(r, c); occ[r][c] = ch0 !== ' ' && !(ch0 === '.' && !nearSolid(r, c)); continue; }
                var x0 = Math.floor(c * CW), x1 = Math.min(g.width, Math.floor((c + 1) * CW)), y0 = Math.floor(r * CH), y1 = Math.min(g.height, Math.floor((r + 1) * CH));
                var sum = 0, cnt = 0;
                for (var yy = y0; yy < y1; yy++) for (var xx = x0; xx < x1; xx++) { sum += img[(yy * g.width + xx) * 4 + 3]; cnt++; }
                occ[r][c] = cnt > 0 && sum / (cnt * 255) > 0.4;
            }
        }
        function isOcc(r2, c2) { return r2 >= 0 && r2 < rows && c2 >= 0 && c2 < cols && occ[r2][c2]; }

        // ---------- 2. Give it volume: every stroke becomes a round tube ----------
        var INF = 1e9, dg = Math.sqrt(CW * CW + CH * CH), dist = [], rho = [], hh = [];
        for (r = 0; r < rows; r++) { dist[r] = []; rho[r] = []; hh[r] = []; for (c = 0; c < cols; c++) dist[r][c] = occ[r][c] ? INF : 0; }
        function rd(r2, c2) { return (r2 >= 0 && r2 < rows && c2 >= 0 && c2 < cols) ? dist[r2][c2] : 0; }
        for (r = 0; r < rows; r++) for (c = 0; c < cols; c++) if (occ[r][c])
            dist[r][c] = Math.min(dist[r][c], rd(r - 1, c) + CH, rd(r, c - 1) + CW, rd(r - 1, c - 1) + dg, rd(r - 1, c + 1) + dg);
        for (r = rows - 1; r >= 0; r--) for (c = cols - 1; c >= 0; c--) if (occ[r][c])
            dist[r][c] = Math.min(dist[r][c], rd(r + 1, c) + CH, rd(r, c + 1) + CW, rd(r + 1, c + 1) + dg, rd(r + 1, c - 1) + dg);
        for (r = 0; r < rows; r++) for (c = 0; c < cols; c++) {
            if (!occ[r][c]) { rho[r][c] = 0; hh[r][c] = 0; continue; }
            var mx = 0;
            for (var a1 = -3; a1 <= 3; a1++) for (var b1 = -5; b1 <= 5; b1++) { var qd = rd(r + a1, c + b1); if (qd > mx) mx = qd; }
            rho[r][c] = Math.min(60, Math.max(mx, 12));
        }
        for (r = 0; r < rows; r++) for (c = 0; c < cols; c++) {
            if (!occ[r][c]) continue;
            var rr = rho[r][c], e = Math.min(Math.max(1, dist[r][c] - CW * 0.5), rr);
            hh[r][c] = Math.sqrt(Math.max(0, rr * rr - (rr - e) * (rr - e)));
        }
        if (SHAPE === 'fat') {
            // Fat slab: flat faces and walls, rounded edges, a slightly puffy face.
            var HALFT = 170, BEV = 64, PUFF = 28;
            for (r = 0; r < rows; r++) for (c = 0; c < cols; c++) if (occ[r][c]) {
                var de2 = Math.max(1, dist[r][c] - CW * 0.5), e2 = Math.min(de2, BEV), u2 = 1 - e2 / BEV;
                hh[r][c] = HALFT - BEV + BEV * Math.sqrt(Math.max(0, 1 - u2 * u2)) + PUFF * Math.sqrt(Math.min(de2, 140) / 140);
            }
        }
        if (SHAPE === 'body') {
            // Side profile = front profile: at every row the body is as deep as it is wide, with a round cross-section.
            for (r = 0; r < rows; r++) {
                var mnC = cols, mxC = -1;
                for (c = 0; c < cols; c++) if (occ[r][c]) { if (c < mnC) mnC = c; if (c > mxC) mxC = c; }
                if (mxC < 0) continue;
                var Rr = (mxC - mnC + 1) * CW / 2, xcr = (mnC + mxC + 1) / 2 * CW;
                for (c = 0; c < cols; c++) if (occ[r][c]) {
                    var dx = (c + 0.5) * CW - xcr;
                    hh[r][c] = Math.max(6, Math.sqrt(Math.max(0, Rr * Rr - dx * dx)));
                }
            }
        }
        function norm(a, b, d) { var m = Math.sqrt(a * a + b * b + d * d) || 1; return [a / m, b / m, d / m]; }
        var P = [];   // x, y, z, nx, ny, nz
        for (r = 0; r < rows; r++) for (c = 0; c < cols; c++) {
            if (!occ[r][c]) continue;
            var x = (c + 0.5) * CW - W / 2, y = (r + 0.5) * CH - H / 2, h = hh[r][c];
            var hx = ((isOcc(r, c + 1) ? hh[r][c + 1] : 0) - (isOcc(r, c - 1) ? hh[r][c - 1] : 0)) / (2 * CW);
            var hy = ((isOcc(r + 1, c) ? hh[r + 1][c] : 0) - (isOcc(r - 1, c) ? hh[r - 1][c] : 0)) / (2 * CH);
            var nf = norm(-hx, -hy, 1), nb = norm(-hx, -hy, -1);
            var oc = ORIG ? '.:-=+*#'.indexOf(at(r, c)) : -1;
            P.push([x, y, h, nf[0], nf[1], nf[2], oc]);
            P.push([x, y, -h, nb[0], nb[1], nb[2], oc]);
            var ox = (isOcc(r, c - 1) ? 0 : -1) + (isOcc(r, c + 1) ? 0 : 1);
            var oy = (isOcc(r - 1, c) ? 0 : -1) + (isOcc(r + 1, c) ? 0 : 1);
            if (ox || oy) {
                var nw = norm(ox, oy * 0.5, 0);
                for (var z = -h + 5; z < h - 2; z += 9) P.push([x + ox * CW * 0.35, y + oy * CH * 0.35, z, nw[0], nw[1], 0, 6]);
            }
        }

        // Falling dots in the space around the sign.
        var D = [];
        for (var k = 0; k < (HOLO ? 0 : 190); k++) D.push({ x: (Math.random() - 0.5) * W * 1.7, y0: (Math.random() - 0.5) * H * 1.25, z: (Math.random() * 2 - 1) * 420, v: 16 + Math.random() * 34 });

        // ---------- 3. Character sprites: the shade of a surface picks both the character and the green ----------
        var CHARS = '.:-=+*#', LV = 10, SPR = [], sw = Math.ceil(CW * 2), sh = Math.ceil(CH * 1.4);
        for (var ci = 0; ci < CHARS.length; ci++) {
            SPR[ci] = [];
            for (var lv = 0; lv < LV; lv++) {
                var cv = document.createElement('canvas'); cv.width = sw * 2; cv.height = sh * 2;
                var cx = cv.getContext('2d'); cx.scale(2, 2);
                var t = lv / (LV - 1), gg = Math.round(80 + 175 * t), rb = Math.round(255 * Math.pow(t, 3) * 0.7);
                cx.fillStyle = 'rgb(' + rb + ',' + gg + ',' + rb + ')';
                cx.font = '14px monospace'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
                cx.fillText(CHARS[ci], sw / 2, sh / 2);
                SPR[ci][lv] = cv;
            }
        }

        // ---------- 4. Render ----------
        var CAM = 2400, TILT = -0.16, BOB = 26, L1 = norm(-0.45, -0.55, 0.75), L2 = norm(0.7, 0.3, 0.3);
        var cT = Math.cos(TILT), sT = Math.sin(TILT), vw = 0, vh = 0, dpr = 1, scale = 1;
        function size() {
            dpr = Math.min(2, window.devicePixelRatio || 1);
            vw = window.innerWidth; vh = window.innerHeight;
            canvas.width = vw * dpr; canvas.height = vh * dpr;
            scale = Math.min(vw / (W * 1.55), vh / (H * 1.3));
        }
        window.addEventListener('resize', size); size();
        function ease(u) { u = Math.max(0, Math.min(1, u)); return u * u * (3 - 2 * u); }

        var items = [], t0 = performance.now(), done = false;
        function frame(now) {
            var secs = (now - t0) / 1000;
            var alpha = 1;
            if (fixed === null) {
                alpha = ease(secs / FADE_IN);
                if (!LOOP && secs > FADE_IN + HOLD) alpha = 1 - ease((secs - FADE_IN - HOLD) / FADE_OUT);
            }
            var move = (calm || fixed !== null) ? 0 : secs;
            var sp = secs + PHASE;
            var th = fixed !== null ? fixed * Math.PI / 180 : (calm ? 0.5 : DIR * sp * 2 * Math.PI / 42);
            var bob = (calm || fixed !== null) ? 0 : BOB * Math.sin(2 * Math.PI * sp / 3.6);
            var cy = Math.cos(th), sy = Math.sin(th);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            if (EMBED) ctx.clearRect(0, 0, vw, vh); else { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, vw, vh); }
            if (HOLO && !calm) alpha *= 0.8 + 0.12 * Math.sin(secs * 23) + 0.08 * Math.sin(secs * 7.3 + 1) * Math.sin(secs * 41);
            ctx.globalCompositeOperation = HOLO ? 'lighter' : 'source-over';
            ctx.globalAlpha = alpha;
            var n = 0, i, p;
            for (i = 0; i < P.length; i++) {
                p = P[i];
                var x1 = p[0] * cy + p[2] * sy, z1 = -p[0] * sy + p[2] * cy;
                var y2 = p[1] * cT - z1 * sT + bob, z2 = p[1] * sT + z1 * cT;
                var nx1 = p[3] * cy + p[5] * sy, nz1 = -p[3] * sy + p[5] * cy;
                var ny2 = p[4] * cT - nz1 * sT, nz2 = p[4] * sT + nz1 * cT;
                if (nz2 < 0.1) continue;
                var lit = Math.max(0, nx1 * L1[0] + ny2 * L1[1] + nz2 * L1[2]) * 0.85 + Math.max(0, nx1 * L2[0] + ny2 * L2[1] + nz2 * L2[2]) * 0.25;
                if (p[5] === 0) lit *= 0.6;
                lit = Math.min(1, lit);
                var s = CAM / (CAM - z2);
                items[n++] = { z: z2, sx: x1 * s, sy: y2 * s, s: s, ci: (p[6] >= 0 ? p[6] : Math.min(6, Math.floor(lit * 7))), lv: Math.min(LV - 1, Math.floor((0.35 + 0.65 * lit) * LV)) };
            }
            for (var j = 0; j < D.length; j++) {
                var d = D[j], span = H * 1.25;
                var yy2 = ((d.y0 + d.v * move + span / 2) % span + span) % span - span / 2;
                var s2 = CAM / (CAM - d.z);
                items[n++] = { z: d.z, sx: d.x * s2, sy: yy2 * s2, s: s2, ci: 0, lv: 4 + Math.round(3 * (d.z + 420) / 840) };
            }
            items.length = n;
            items.sort(function (a, b) { return a.z - b.z; });
            var ox2 = vw / 2, oy2 = vh / 2;
            for (var m = 0; m < n; m++) {
                var it = items[m], sp = SPR[it.ci][it.lv], qs = scale * it.s;
                ctx.drawImage(sp, ox2 + it.sx * scale - sw * qs / 2, oy2 + it.sy * scale - sh * qs / 2, sw * qs, sh * qs);
            }
            ctx.globalAlpha = 1;
            ctx.globalCompositeOperation = 'source-over';
            if (HOLO) {                                   // hologram scanlines
                ctx.globalCompositeOperation = 'destination-out';
                ctx.fillStyle = 'rgba(0,0,0,0.28)';
                var off = calm ? 0 : (secs * 12) % 4;
                for (var ly = off; ly < vh; ly += 4) ctx.fillRect(0, ly, vw, 1.5);
                ctx.globalCompositeOperation = 'source-over';
            }
            if (fixed === null && !LOOP && secs > FADE_IN + HOLD + FADE_OUT) {
                if (!done) {
                    done = true;
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); if (EMBED) ctx.clearRect(0, 0, vw, vh); else { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, vw, vh); }
                    window.dispatchEvent(new CustomEvent('rsn-welcome-done'));
                    try { parent.postMessage({ type: 'rsn-welcome-done' }, '*'); } catch (e) {}
                }
                return;
            }
            if (fixed === null) requestAnimationFrame(frame);
        }
        frame(performance.now());
        if (fixed === null) requestAnimationFrame(frame);
    })();
    </script>
</body>
</html>
