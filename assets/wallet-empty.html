<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet empty</title>
    <link rel="stylesheet" href="alert-banner.css">
    <style>
        html, body { height: 100%; margin: 0; background: var(--rsn-grey); color: var(--rsn-text); font: 16px/1.5 system-ui, sans-serif; }
        .page { display: flex; flex-direction: column; height: 100%; }
        .rsn-alert-strip { flex: none; padding-top: 0; }
        .stage { position: relative; flex: 1; min-height: 0; }
        .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
        .note { position: absolute; left: 0; right: 0; bottom: 6%; text-align: center; color: #8a8f98; font-size: .95rem; padding: 0 16px; }
    </style>
</head>
<body>
    <div class="page">
        <div class="rsn-alert-strip"><div class="rsn-alert" role="alert"><span>Your wallet is empty. Add funds to continue.</span></div></div>
        <div class="stage">
            <iframe src="ambient-dollar-3d.html?embed=1&loop=1" title="" tabindex="-1"></iframe>
            <div class="note">Nothing to spend yet.</div>
        </div>
    </div>
</body>
</html>
