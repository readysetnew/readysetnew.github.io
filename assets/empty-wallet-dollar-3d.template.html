<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIG and small DOLLAR IDEAS</title>
    <style>
        html, body { height: 100%; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #000;
            color: #0f0; /* Green text on black background, classic terminal style */
            font-family: monospace;
            overflow: hidden;
        }
        pre {
            text-align: center;
            font-size: 14px;
            line-height: 1.2;
            white-space: pre;
            margin: 0;
        }
        #view { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; display: block; }
    </style>
</head>
<body>
    <canvas id="view" hidden></canvas>
    <!-- Original front-view art. It is the blueprint for the 3D model and the fallback if scripts are off. -->
    <pre id="art">
/*ART*/</pre>
    <script>
    (function () {
        var art = document.getElementById('art');
        var canvas = document.getElementById('view');
        var ctx = canvas.getContext('2d');
        if (!ctx) return;

        // ---------- 1. Read the front view ----------
        var lines = art.textContent.replace(/^\n/, '').replace(/\s+$/, '').split('\n');
        var rows = lines.length, cols = 0;
        lines.forEach(function (l) { cols = Math.max(cols, l.length); });

        var probe = document.createElement('pre');
        probe.style.cssText = 'position:absolute;visibility:hidden;margin:0;white-space:pre';
        probe.textContent = new Array(101).join('M');
        document.body.appendChild(probe);
        var CW = probe.getBoundingClientRect().width / 100;
        var CH = parseFloat(getComputedStyle(art).fontSize) * 1.2;
        document.body.removeChild(probe);
        var W = cols * CW, H = rows * CH;

        function at(r, c) { var l = lines[r]; return (l && c >= 0 && c < l.length) ? l[c] : ' '; }
        function solid(ch) { return ch !== ' ' && ch !== '.'; }
        function nearSolid(r, c) {
            for (var dr = -2; dr <= 2; dr++) for (var dc = -2; dc <= 2; dc++) if (solid(at(r + dr, c + dc))) return true;
            return false;
        }
        var occ = [], loose = [];
        for (var r = 0; r < rows; r++) {
            occ[r] = [];
            for (var c = 0; c < cols; c++) {
                var ch0 = at(r, c);
                var isLoose = ch0 === '.' && !nearSolid(r, c);
                if (isLoose) loose.push({ r: r, c: c });
                occ[r][c] = ch0 !== ' ' && !isLoose;
            }
        }
        function isOcc(r, c) { return r >= 0 && r < rows && c >= 0 && c < cols && occ[r][c]; }

        // ---------- 2. Grow it into a true 3D solid (fantasy depth) ----------
        // Every stroke becomes a round tube: its thickness equals its own width, so the cross-section is a circle.
        // The tube also weaves toward and away from the viewer along its length, so no part of it lies in one plane.
        var RANK = ' .:-=+*#', CHARS = '.:-=+*#';
        var INF = 1e9, dg = Math.sqrt(CW * CW + CH * CH);
        var dist = [], rho = [], hh = [];
        for (r = 0; r < rows; r++) { dist[r] = []; rho[r] = []; hh[r] = []; for (c = 0; c < cols; c++) dist[r][c] = occ[r][c] ? INF : 0; }
        function rd(r2, c2) { return (r2 >= 0 && r2 < rows && c2 >= 0 && c2 < cols) ? dist[r2][c2] : 0; }
        for (r = 0; r < rows; r++) for (c = 0; c < cols; c++) if (occ[r][c]) {   // distance to the outline, pass 1
            dist[r][c] = Math.min(dist[r][c], rd(r - 1, c) + CH, rd(r, c - 1) + CW, rd(r - 1, c - 1) + dg, rd(r - 1, c + 1) + dg);
        }
        for (r = rows - 1; r >= 0; r--) for (c = cols - 1; c >= 0; c--) if (occ[r][c]) {   // pass 2
            dist[r][c] = Math.min(dist[r][c], rd(r + 1, c) + CH, rd(r, c + 1) + CW, rd(r + 1, c + 1) + dg, rd(r + 1, c - 1) + dg);
        }
        for (r = 0; r < rows; r++) for (c = 0; c < cols; c++) {   // local stroke radius = biggest distance nearby
            if (!occ[r][c]) { rho[r][c] = 0; continue; }
            var mx = 0;
            for (var a1 = -5; a1 <= 5; a1++) for (var b1 = -10; b1 <= 10; b1++) { var q = rd(r + a1, c + b1); if (q > mx) mx = q; }
            rho[r][c] = Math.min(130, Math.max(mx, 14));
        }
        var Z0 = 170;                                           // how far the tube weaves in depth
        function zc(y) { return Z0 * Math.cos(2 * Math.PI * y / H); }       // far at the ends, near in the middle
        function dzc(y) { return -Z0 * 2 * Math.PI / H * Math.sin(2 * Math.PI * y / H); }
        for (r = 0; r < rows; r++) for (c = 0; c < cols; c++) {
            if (!occ[r][c]) { hh[r][c] = 0; continue; }
            var de = Math.max(1, dist[r][c] - CW * 0.5), rr = rho[r][c];
            var e = Math.min(de, rr);
            hh[r][c] = Math.sqrt(Math.max(0, rr * rr - (rr - e) * (rr - e)));
        }

        function norm(a, b, c) { var m = Math.sqrt(a * a + b * b + c * c) || 1; return [a / m, b / m, c / m]; }
        var P = [];   // surface points: x,y,z, nx,ny,nz, char index
        for (r = 0; r < rows; r++) for (c = 0; c < cols; c++) {
            if (!occ[r][c]) continue;
            var x = (c + 0.5) * CW - W / 2, y = (r + 0.5) * CH - H / 2;
            var h = hh[r][c], zm = zc(y), dz = dzc(y);
            var hx = ((isOcc(r, c + 1) ? hh[r][c + 1] : 0) - (isOcc(r, c - 1) ? hh[r][c - 1] : 0)) / (2 * CW);
            var hy = ((isOcc(r + 1, c) ? hh[r + 1][c] : 0) - (isOcc(r - 1, c) ? hh[r - 1][c] : 0)) / (2 * CH);
            var ci = CHARS.indexOf(at(r, c));
            var nf = norm(-hx, -(dz + hy), 1), nb = norm(-hx, dz - hy, -1);
            P.push([x, y, zm + h, nf[0], nf[1], nf[2], ci]);     // front face: the original characters, in place
            P.push([x, y, zm - h, nb[0], nb[1], nb[2], ci]);     // rear face of the tube
            // Rim wall so the tube looks solid from the side.
            var ox = (isOcc(r, c - 1) ? 0 : -1) + (isOcc(r, c + 1) ? 0 : 1);
            var oy = (isOcc(r - 1, c) ? 0 : -1) + (isOcc(r + 1, c) ? 0 : 1);
            if (ox || oy) {
                var nw = norm(ox, oy * 0.5, 0);
                for (var z = zm - h + 5; z < zm + h - 2; z += 10) P.push([x + ox * CW * 0.35, y + oy * CH * 0.35, z, nw[0], nw[1], 0, 6]);
            }
        }

        // Falling dots live in the room around the model, at random depths.
        var D = [];
        loose.forEach(function (d) {
            D.push({ x: (d.c + 0.5) * CW - W / 2, y0: (d.r + 0.5) * CH - H / 2, z: (Math.random() * 2 - 1) * 420, v: 16 + Math.random() * 34 });
        });
        // A few extra drops so the depth reads.
        for (var k = 0; k < 70; k++) D.push({ x: (Math.random() - 0.5) * W * 1.25, y0: (Math.random() - 0.5) * H * 1.1, z: (Math.random() * 2 - 1) * 420, v: 16 + Math.random() * 34 });

        // ---------- 3. Glyph sprites (char x brightness) ----------
        var LV = 10, SPR = [];
        var sw = Math.ceil(CW * 2), sh = Math.ceil(CH * 1.4);
        for (var ci2 = 0; ci2 < CHARS.length; ci2++) {
            SPR[ci2] = [];
            for (var lv = 0; lv < LV; lv++) {
                var cv = document.createElement('canvas'); cv.width = sw * 2; cv.height = sh * 2;
                var cx = cv.getContext('2d');
                cx.scale(2, 2);
                var t = lv / (LV - 1);
                var g = Math.round(70 + 185 * t), rb = Math.round(255 * Math.pow(t, 3) * 0.7);
                cx.fillStyle = 'rgb(' + rb + ',' + g + ',' + rb + ')';
                cx.font = '14px monospace'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
                cx.fillText(CHARS[ci2], sw / 2, sh / 2);
                SPR[ci2][lv] = cv;
            }
        }

        // ---------- 4. Render loop ----------
        var calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        var fixed = /[?&]angle=(-?[\d.]+)/.exec(location.search);
        var CAM = 2400, TILT = -0.16, LIGHT = norm(-0.45, -0.55, 0.75);
        var cT = Math.cos(TILT), sT = Math.sin(TILT);
        var vw = 0, vh = 0, dpr = 1, scale = 1;
        function size() {
            dpr = Math.min(2, window.devicePixelRatio || 1);
            vw = window.innerWidth; vh = window.innerHeight;
            canvas.width = vw * dpr; canvas.height = vh * dpr;
            scale = Math.min(vw / (W * 1.3), vh / (H * 1.15));
        }
        window.addEventListener('resize', size); size();
        art.hidden = true; canvas.hidden = false;

        var items = [], t0 = performance.now();
        function frame(now) {
            var secs = calm ? 0 : (now - t0) / 1000;
            var th = fixed ? parseFloat(fixed[1]) * Math.PI / 180 : (calm ? 0.5 : secs * 2 * Math.PI / 42);
            var cy = Math.cos(th), sy = Math.sin(th);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, vw, vh);
            var n = 0;
            // Model points: rotate, light, cull back faces.
            for (var i = 0; i < P.length; i++) {
                var p = P[i];
                var x1 = p[0] * cy + p[2] * sy, z1 = -p[0] * sy + p[2] * cy;
                var y2 = p[1] * cT - z1 * sT, z2 = p[1] * sT + z1 * cT;
                var nx1 = p[3] * cy + p[5] * sy, nz1 = -p[3] * sy + p[5] * cy;
                var ny2 = p[4] * cT - nz1 * sT, nz2 = p[4] * sT + nz1 * cT;
                if (nz2 < 0.1) continue;                                   // facing away
                var lit = Math.max(0, nx1 * LIGHT[0] + ny2 * LIGHT[1] + nz2 * LIGHT[2]);
                if (p[5] === 0) lit *= 0.45;                                // rim walls stay dim so the face reads clearly
                var s = CAM / (CAM - z2);
                items[n++] = { z: z2, sx: x1 * s, sy: y2 * s, s: s, ci: p[6], lv: Math.min(LV - 1, Math.floor((0.18 + 0.82 * lit) * LV)) };
            }
            // Falling dots (world space, the model turns inside them).
            for (var j = 0; j < D.length; j++) {
                var d = D[j];
                var yy = d.y0 + d.v * secs;
                var span = H * 1.2;
                yy = ((yy + span / 2) % span + span) % span - span / 2;
                var s2 = CAM / (CAM - d.z);
                items[n++] = { z: d.z, sx: d.x * s2, sy: yy * s2, s: s2, ci: 0, lv: 4 + Math.round(3 * (d.z + 420) / 840) };
            }
            items.length = n;
            items.sort(function (a, b) { return a.z - b.z; });
            var ox = vw / 2, oy = vh / 2;
            for (var m = 0; m < n; m++) {
                var it = items[m], sp = SPR[it.ci][it.lv], q = scale * it.s;
                ctx.drawImage(sp, ox + it.sx * scale - sw * q / 2, oy + it.sy * scale - sh * q / 2, sw * q, sh * q);
            }
            if (!calm && !fixed) requestAnimationFrame(frame);
        }
        frame(performance.now());
        if (!calm && !fixed) requestAnimationFrame(frame);
    })();
    </script>
</body>
</html>
