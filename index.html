<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ready Set New</title>
<style>
  :root { --bg:#0f1115; --fg:#e8e8e8; --muted:#8a8f98; --accent:#5ee3a1; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { min-height:100%; display:grid; place-items:center; padding:24px 16px; box-sizing:border-box; }
  .card { max-width:520px; text-align:center; }
  h1 { font-size:2rem; margin:0 0 8px; letter-spacing:-0.02em; }
  p { margin:0; color:var(--muted); }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--accent); margin-right:8px; vertical-align:middle; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Ready Set New</h1>
    <p><span class="dot"></span>Server online. The system will appear here.</p>
  </div>
</main>
</body>
</html>
